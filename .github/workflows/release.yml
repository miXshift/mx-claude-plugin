name: release

# Cuts an org-distribution GitHub Release when a version tag is pushed.
#
# Trigger: a tag matching `mixshift-ai--v*` (the tag convention already used for
# releases, e.g. mixshift-ai--v0.8.0). On that tag this workflow re-runs the
# deterministic CI gates (the same blocking set as ci.yml — typecheck, tests,
# manifest validation, telemetry convention, version + docs currency, build),
# verifies the tag version matches plugin.json, builds the two release zips with
# `npm run package-zip`, and attaches BOTH to the GitHub Release for the tag.
#
# The deployed named-query check is fail-closed against the public tenant-free
# compatibility manifest. Skill contracts and deployment compatibility both
# block every release.

on:
  push:
    tags:
      - 'mixshift-ai--v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: plugins/mixshift-ai/harness

jobs:
  release:
    name: Build gates + package zips + publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/mixshift-ai/harness/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Verify tag version matches plugin.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mixshift-ai--v}"
          PLUGIN_VERSION="$(node -p "require('../.claude-plugin/plugin.json').version")"
          echo "tag=${GITHUB_REF_NAME} -> version ${TAG_VERSION}; plugin.json = ${PLUGIN_VERSION}"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag version '${TAG_VERSION}' does not match plugin.json version '${PLUGIN_VERSION}'."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Validate skill manifests
        run: npm run validate-manifests

      - name: Skill telemetry convention
        run: npm run check-skills

      - name: Skill version consistency (SKILL.md <-> manifest)
        run: npm run check-versions

      - name: Docs currency (README skill table + count, plugin/marketplace version sync)
        run: npm run check-docs

      - name: Skill contract resolution (sql_ids, context fields, upstream, command surfaces)
        run: npm run check-contracts

      - name: Deployed named-query pack compatibility
        run: npm run check-named-pack
        env:
          MIXSHIFT_PACK_CHECK_API_BASE: https://mcp.mixshift.io

      - name: Build CLI bundle
        run: npm run build

      # package-zip sources every byte from the committed HEAD blobs (never the
      # working tree), so a release tagged with a stale committed dist/ would
      # otherwise ship stale bytes while this job's fresh build gets discarded.
      # Fail the release if the fresh build differs from what is committed.
      # build-meta.json is excluded: build.mjs rewrites its timestamp on every
      # run, so it always differs; cli.js is the shipped artifact that matters.
      - name: Verify committed dist matches a fresh build
        run: |
          if ! git diff --exit-code -- dist/cli.js; then
            echo "::error::dist/cli.js is stale: the committed bundle does not match a fresh build. Run the build, commit dist/, and re-tag."
            exit 1
          fi

      - name: Package release zips
        run: npm run package-zip

      - name: Publish GitHub Release with both zips
        # Third-party action in a contents:write job -> SHA-pinned for
        # supply-chain hygiene (same posture as the pinned gitleaks CLI);
        # bump the SHA deliberately, comment tracks the release it points at.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # `files` is resolved from the repo root (GITHUB_WORKSPACE), not the
          # run working-directory; package-zip writes to <repo-root>/dist-zip.
          files: |
            dist-zip/mixshift-ai-plugin-*.zip
            dist-zip/mixshift-ai-marketplace-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

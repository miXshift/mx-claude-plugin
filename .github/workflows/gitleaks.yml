name: gitleaks

# Scan every push + PR for committed secrets.
#
# Why: GitGuardian gave us one warning about a leaked Discord webhook in
# May 2026. Belt-and-suspenders defense: GitHub-side scanning (GitGuardian)
# alerts within minutes of push, but we want our OWN check that fails the
# CI build BEFORE merge so unreviewed commits don't get the public stamp
# of an auto-merged PR.
#
# We run the gitleaks CLI binary directly instead of gitleaks-action@v2.
# The CLI is MIT-licensed and free; only the ACTION wrapper requires a
# paid GITLEAKS_LICENSE for organization accounts. Running the binary
# also drops the deprecated-Node action runtime and lets us pass
# --config natively (the action rejected the config-path input).
#
# Local equivalent: developers can run `gitleaks detect` before pushing
# (see CONTRIBUTING.md). The config at `.gitleaks.toml` defines our
# allowlist + custom rules (Discord webhooks, etc.).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits

      - name: Install gitleaks CLI
        env:
          # Pinned for supply-chain hygiene; bump deliberately.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan full git history
        # Exit code 1 on findings fails the job. --redact keeps any hit
        # out of the CI log; the finding's location is still reported.
        run: |
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose

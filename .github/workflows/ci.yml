name: ci

# Runs the harness quality gates that CONTRIBUTING.md prescribes as the manual
# pre-flight, so they gate every PR automatically instead of by honor system.
# Until now the ONLY CI was gitleaks.yml (secrets scanning) — typecheck, tests,
# manifest validation, the skill telemetry convention, version consistency, and
# the build were all manual. This wires the deterministic ones in.
#
# One job:
#   gates — typecheck, test (incl. the golden fixture), manifest validation, the
#   skill telemetry convention, and the build are BLOCKING (green on main today).
#   check-versions and check-docs are BLOCKING (check-docs gates the README skill
#   table + count and the plugin.json <-> marketplace.json version sync).
#   check-contracts is BLOCKING: shipped skills cannot reference missing SQL,
#   context fields, upstream skills, or unimplemented command surfaces.
#   check-named-pack is BLOCKING and reads the public tenant-free deployment
#   manifest. This catches plugin/gateway skew before merge.
#   check-figures is BLOCKING and catches the HALF of plugin/gateway skew that
#   check-named-pack structurally cannot see: the deployed manifest carries ids
#   with no param schema, so a tuned default moving under the docs (0.99 -> 0.25
#   in Sep 2026) passes it untouched. It compares every anchored restatement of
#   a tuned default -- across the whole repo, skills and harness and shared
#   catalog and html assets alike -- against a lock vendored from the gateway,
#   and holds each figure to a recorded SITE COUNT so losing one of several
#   restatements fails instead of being absorbed.
#
# The JOB NAME is deliberately left unchanged when gates are added: it is the
# check-run name branch protection matches on, and renaming it silently drops
# the required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/mixshift-ai/harness

jobs:
  gates:
    name: Harness gates (typecheck, test, manifests, telemetry, contracts, versions, docs, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/mixshift-ai/harness/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Validate skill manifests
        run: npm run validate-manifests

      - name: Skill telemetry convention
        run: npm run check-skills

      - name: Skill version consistency (SKILL.md <-> manifest)
        run: npm run check-versions

      - name: Docs currency (README skill table + count, plugin/marketplace version sync)
        run: npm run check-docs

      - name: No internal-skill exposure (nothing tracked under .claude/skills/ in the public repo)
        run: npm run check-no-internal-exposure

      - name: Skill contract resolution (sql_ids, context fields, upstream, command surfaces)
        run: npm run check-contracts

      # Validates changelog.d/ fragment names + shape. Does NOT require a PR to
      # ship a fragment: a docs-only or internal change legitimately has none.
      - name: Changelog fragments well-formed
        run: npm run check-changelog-fragments

      - name: Deployed named-query pack compatibility
        run: npm run check-named-pack
        env:
          MIXSHIFT_PACK_CHECK_API_BASE: https://mcp.mixshift.io

      # Runs BESIDE check-named-pack because it closes that check's blind spot:
      # the deployed pack manifest is {schema_version, ids} with no param schema,
      # so it passes whether or not the service's tuned defaults match what the
      # docs tell a brief author. Reads the vendored figures.lock.json, needs no
      # network, and is BLOCKING.
      - name: Figure drift (docs vs the gateway's tuned defaults)
        run: npm run check-figures

      - name: Build CLI bundle
        run: npm run build

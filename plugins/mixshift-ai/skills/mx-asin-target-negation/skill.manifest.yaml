schema_version: 1
skill_id: mx-asin-target-negation
display_name: ASIN Target Negation Review
version: "1.8.1"
description: >
  Phase 2 negation review for ASIN targets matched through auto campaigns, category targeting,
  and other Product Attribute Targeting paths. Suppresses ASINs already under manual targeting,
  evaluates PDP and form-factor overlap, joins lifetime performance at location granularity,
  and separates clean negate candidates from review and watch buckets.
run_kind: per_account
cadence: on_demand
risk_tier: 3
allowed_tools: [db_read, file_read, file_write, renderer, prefetch, ads_write]
side_effect_policy: write_gated   # live sp.create_negative_targets --commit; dry-run default, user-confirmed
review_required: always
escalation_conditions:
  - corpora/conq_asins.csv absent (Layer 1 suppression mask unavailable — surface warning)
sql_ids:
  - ANEG-01
  - ANEG-02
  - ANEG-03
  - ANEG-04
pre_execution:
  enabled: true
  artifact_path: "runs/{brand_slug}/{skill_id}/{run_date}/data.json"
  batch_plan:
    - round: 1
      parallel: [ANEG-01, ANEG-02, ANEG-03, ANEG-04]
      notes: >
        All 4 queries are independent with fixed params known upfront. ANEG-01 is the
        Corpus Layer 2 positive-examples pre-check. ANEG-02 is the window PAT pull.
        ANEG-03 is the manual-target suppression mask. ANEG-04 is the lifetime performance
        join (UNION of keywordtargetingmetric + targetexpressionsmetric by location).
required_context_fields:
  - accounts[*].seller_id
  - accounts[*].account_type
  - negation.lane_rules
  - negation.protected_terms
  - sub_brands
  - campaign_structure.naming_pattern
  - management.acos_target_pct
  - management.attribution_window_days
  - posture.stance
  - structural_events
optional_context_fields:
  - corpora   # manual conquest ASIN lists by item group (corpus layer 1)
artifacts:
  - name: mx-asin-target-negation.html
    type: report_html
verdict_range: [GREEN, YELLOW, RED, OBSERVATIONAL]
pricing_tier: pro
trigger_phrases:
  - run asin negation review
  - asin target negations
  - pdp overlap review
  - phase 2 negations
  - asin exact negations
  - which competitor asins are on my product pages
  - competitor asins showing on my listings
notes: >
  ANEG-04 queries both keywordtargetingmetric and targetexpressionsmetric and UNIONs before
  aggregating. Manual asinSameAs/asinCategorySameAs CONQ/PROF targets record performance in
  targetexpressionsmetric only -- querying only keywordtargetingmetric will undercount orders.
  Location-granular lifetime data is required for negate decisions; account-wide aggregates
  are context only.

# OCL — Objective Level Configuration (the confirm-on-run knobs).
# pre_check_lifetime_orders is the negate-safety floor (a location needs at
# least this many lifetime orders before an ASIN target is eligible to negate),
# seeded from the brand's negation.asin_negation.pre_check_lifetime_orders_threshold
# with a conservative default so the skill never fail-closes when context is
# thin. acos_target is the shared brand target as an optional per-skill
# override. Structured negation context (lane_rules, protected_terms) is read
# through the resolver, not surfaced here.
calibration:
  schema_version: 1
  fields:
    - id: pre_check_lifetime_orders
      label: "Min lifetime orders to negate"
      prompt: "Minimum lifetime orders at a location before an ASIN target can be negated for {brand_name}?"
      help: >
        Protects converting locations: an ASIN target is not a negate candidate
        until the location has at least this many lifetime orders. Higher =
        more conservative (negate less). Defaults to a conservative floor when
        the brand has not set one.
      type: int
      default: 25
      range: { min: 0, max: 100000 }
      seed_from: context.negation.asin_negation.pre_check_lifetime_orders_threshold
      required: true
    - id: acos_target
      label: "ACoS target"
      prompt: "ACoS target the ASIN negation review should use for {brand_name}?"
      help: >
        Reference ACoS for the negate / keep / watch bucketing. Defaults to
        your brand's ACoS target (Tier-3 context.yaml, else the Tier-2 brain).
        Override only if this review should use a different target.
      type: percent
      range: { min: 0.05, max: 1.0 }
      seed_from: context.management.acos_target_pct
      required: false

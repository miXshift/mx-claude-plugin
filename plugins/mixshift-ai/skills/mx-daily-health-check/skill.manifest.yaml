schema_version: 1
skill_id: mx-daily-health-check
display_name: Daily Advertising Performance Health Check
version: "0.2.0"
description: >
  Comprehensive daily exception-based analysis of advertising account performance across
  campaign types, objectives, and item groups. Uses percentile-based confidence intervals
  to detect spend and ACOS anomalies. Produces an HTML report with a GREEN, YELLOW, or RED
  verdict and a structured sidecar for drift detection.
run_kind: per_account
cadence: daily
risk_tier: 3
allowed_tools: [db_read, file_read, file_write, renderer, prefetch]
side_effect_policy: recommendation_only
review_required: on_non_green
escalation_conditions:
  - required context fields missing or null (HARD GATE)
  - data freshness > 7 days
  - verdict regresses from prior run without structural_events explanation
  - prior-run sidecar absent
sql_ids:
  - DHC-01
  - DHC-02
  - DHC-03
  - DHC-04
  - DHC-05
  - DHC-06
  - DHC-07
  - DHC-08
  - DHC-09
  - DHC-10
  - DHC-11
  - DHC-12
  - LIB-PT-01   # conditional: only when context.yaml::structural_events includes an active price_test
pre_execution:
  enabled: true
  artifact_path: "runs/{brand_slug}/{skill_id}/{run_date}/data.json"
  batch_plan:
    - round: 1
      parallel: [DHC-01, DHC-02, DHC-03, DHC-04, DHC-05, DHC-06, DHC-07, DHC-08, DHC-09, DHC-10, DHC-11, DHC-12]
      notes: >
        DHC-02 applies to SC accounts; DHC-03 applies to VC accounts. Pre-fetch both;
        skill model uses whichever applies. DHC-09 conditional on sub-brand segmentation.
    - round: 2
      parallel: [LIB-PT-01]
      notes: "Conditional: only when structural_events includes an active price_test."
required_context_fields:
  - accounts[*].seller_id
  - accounts[*].account_type
  - management.primary_metric
  - management.acos_target_pct
  - management.attribution_window_days
  - posture.stance
  - posture.multiplier
  - sub_brands
  - campaign_structure.naming_pattern
  - delivery.reports_local_dir
  - delivery.archive_dir
optional_context_fields:
  - capture_rate_calibration   # required for VC Adj. ACOS computation
  - structural_events          # active events downgrade severity or modify interpretation
  - objective_calibration      # per-objective CI thresholds when present
artifacts:
  - name: health-check.html
    type: report_html
verdict_range: [GREEN, YELLOW, RED]
pricing_tier: pro
trigger_phrases:
  - run daily health check
  - check account status
  - how is the account
  - daily performance check
notes: >
  DHC-02 applies to SC accounts; DHC-03 applies to VC accounts (never both in one run).
  DHC-09 fires only when brand context documents sub-brand segmentation.
  LIB-PT-01 fires only when structural_events includes an active price_test entry.
  CI thresholds are always read dynamically from anomaly_detection_settings (DHC-04/DHC-05);
  never hardcode percentiles.
  Sales targets are not required for TACOS-primary accounts; the daily check evaluates
  spend/ACOS/TACOS posture against management fields and context events.

# OCL — Objective Level Configuration.
# Surfaced to the user via the confirm-on-run flow (`mixshift skill config
# mx-daily-health-check --brand <slug>` or implicitly on `mixshift skill run`).
# Sovereign once edited — see lib/calibration/manifest-schema.ts for the
# sovereignty rules. Seeds pull from the brand's context.yaml on first run;
# the user still has to confirm.
calibration:
  schema_version: 1
  # The OCL is what DHC is USING for this specific run. Some fields are
  # brand-level facts surfaced here so the user sees them on the confirm
  # card (seeded from context.yaml — the brand config layer). Others are
  # DHC-specific operational knobs (min spend floor, paused-campaign
  # display) that have no brand-level analogue.
  #
  # Storage: only fields the user explicitly sets are written; the rest
  # are computed from the seed at run-time. So accepting all defaults
  # means config.yaml stays empty for this skill until you actually
  # override something — clean separation between "I touched this" and
  # "I inherited the brand default."
  fields:
    # ACoS / TACoS targets — seeded from brand context. Surfaces what DHC
    # is using so it's never a hidden input. Optional: when unset (the
    # common case), DHC falls back to the brand-level value at run time.
    - id: acos_target
      label: "ACoS target"
      prompt: "ACoS target DHC should use for {brand_name}?"
      help: >
        DHC flags campaigns running materially above this. Defaults to
        your brand's ACoS target from context.yaml. Override here only
        when this specific skill should use a different value (e.g. DHC
        runs at a tighter threshold than monthly reporting).
      type: percent
      range: { min: 0.05, max: 1.0 }
      seed_from: context.management.acos_target_pct
      required: false

    - id: tacos_target
      label: "TACoS target"
      prompt: "TACoS target DHC should use for {brand_name}?"
      help: >
        Total Advertising Cost of Sales — ad spend over TOTAL ordered
        revenue. Catches over-investment in ads even when ACoS looks
        fine. Defaults to your brand's TACoS target from context.yaml.
      type: percent
      range: { min: 0.01, max: 1.0 }
      seed_from: context.management.tacos_target_pct
      required: false

    - id: min_spend_to_flag
      label: "Min daily spend to flag"
      prompt: "Minimum daily spend before a campaign surfaces as YELLOW/RED?"
      help: >
        Anything spending less than this on the analysis day is suppressed
        from the exception list, even if its ACoS is high. Prevents tiny
        campaigns from cluttering the report. Set to 0 to flag everything.
      type: int
      default: 5
      range: { min: 0, max: 10000 }
      required: true

    - id: hero_skus
      label: "Hero SKUs (protect from cuts)"
      prompt: "Hero SKUs that should never be flagged for bid cuts?"
      help: >
        ASINs in this list are excluded from RED/YELLOW recommendations to
        reduce bids or pause. They can still surface as informational. Leave
        empty to apply standard rules to every SKU.
      type: asin_list
      default: []
      max_items: 200
      required: false

    - id: quiet_paused
      label: "Hide paused campaigns"
      prompt: "Suppress paused campaigns from the exception list?"
      help: >
        Paused campaigns can't bleed spend, but they can still flag for
        stale targeting or pending review. Most brands set this to yes
        once the paused set stabilizes. Set to no during a cleanup sprint
        when you want everything visible.
      type: bool
      default: true
      required: true

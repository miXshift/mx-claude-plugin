schema_version: 1
skill_id: auth-setup
display_name: MixShift Auth Setup
version: "0.1.1"
description: >
  Walk the user through one-time warehouse auth setup in Claude chat
  (since Claude Code's Bash tool can't drive interactive TTY prompts).
  Collects credentials in chat, writes to a temp file, runs the harness's
  non-interactive auth setup, cleans up.

# Modeled as per_account because the trigger phrases live in the per-account
# skill family for discovery; the skill itself is account-agnostic.
run_kind: per_account
cadence: on_demand
risk_tier: 2
allowed_tools: [file_read, file_write]   # bash invocation is implicit
side_effect_policy: context_write   # writes credentials + profile to ~/.mixshift/
review_required: never
sql_ids: []

harness_commands:
  - mixshift welcome
  - mixshift auth setup --from-file <tempfile> --request-whitelist

required_context_fields: []
optional_context_fields: []
artifacts:
  - name: credentials
    type: json_artifact   # closest schema enum (~/.mixshift/auth/credentials, JSON-like)
  - name: profile
    type: context_yaml   # closest schema enum (~/.mixshift/profile.yaml)
verdict_range: [OBSERVATIONAL]
pricing_tier: free
trigger_phrases:
  - auth setup
  - set up auth
  - set up my credentials
  - configure mixshift
  - connect to warehouse
notes: >
  The harness CLI supports interactive TTY prompts for terminal users, but
  Claude Code's Bash tool doesn't pass a TTY, so prompts fail with "User
  force closed." This skill bridges the gap by collecting inputs in chat
  and routing them through the existing --from-file mode.

  Writes credentials to ~/.mixshift/auth/credentials and profile to
  ~/.mixshift/profile.yaml. Both are user-private files; never check them
  into git or share externally.

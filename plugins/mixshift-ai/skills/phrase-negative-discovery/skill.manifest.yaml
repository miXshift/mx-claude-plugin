schema_version: 1
skill_id: phrase-negative-discovery
display_name: ST Phrase Negative Discovery
version: "1.2.0"
description: >
  Discovers phrase negative candidates by decomposing the search term corpus into n-grams,
  aggregating performance per sequence, and surfacing sequences with combined spend and zero
  conversion history. Applies conflict detection, semantic clustering, and brand context
  filtering. Phrase negatives have blast radius -- all candidates require manual validation
  before application.
run_kind: per_account
cadence: on_demand
risk_tier: 3
allowed_tools: [file_read, file_write]
side_effect_policy: recommendation_only
review_required: always
escalation_conditions:
  - required context fields missing or null (HARD GATE)
  - search-term-data-pull artifact absent or stale (> 7 days)
  - conflict check finds a protected_term in candidate set (suppress and surface)
sql_ids: []   # pure consumer; depends on search-term-data-pull artifact via upstream_skills
required_context_fields:
  - accounts[*].seller_id
  - management.acos_target_pct
  - negation.protected_terms
  - negation.lane_rules
  - brand_terms
  - sub_brands
  - campaign_structure.naming_pattern
  - structural_events
optional_context_fields:
  - corpora   # manual conquest ASIN lists for conflict checks
  - paused_campaigns   # explicit [] means no known paused campaigns
upstream_skills:
  - search-term-data-pull
artifacts:
  - name: phrase-negative-discovery.html
    type: report_html
verdict_range: [OBSERVATIONAL]
pricing_tier: pro
trigger_phrases:
  - phrase negative discovery
  - find phrase negatives
  - n-gram analysis
  - phrase negative candidates
notes: >
  This skill is a pure consumer of the search-term-data-pull JSON artifact.
  It runs no DB queries of its own. The emitted sidecar records consumption as an
  UPSTREAM:search-term-data-pull pseudo-entry in sql_calls for drift-chain detection.
  Conflict check is mandatory before surfacing any candidate. A phrase negative where
  the root term converts anywhere is suppressed entirely.
  Blast radius must be stated for every candidate before implementation.

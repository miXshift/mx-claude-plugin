# Borrow map: what this skill is made of, and how to lift each piece.
#
# Product bet on record (2026-08-12): users will want pieces of this skill more
# often than the whole. Every component below is designed to be borrowed: it names its
# home, its dependencies, and the smallest correct way to reuse it in another skill.
# Keep this file honest: a component whose "how to lift" no longer works is a defect.

schema_version: 1
skill_id: mx-monthly-report-max

components:
  - id: two-document-structure
    what: >
      The client brief + internal companion split: a client-readable deliverable and a
      private operator document (talking points in call order, numbers to keep off the
      call, owner-attributed commitments, the agency's own misses, the next lever), with
      the placement rules that keep blame out of the client copy.
    home: SKILL.md (the split + Step 8) + references/brief-structure.md (section-by-section)
    depends_on: [a publish target that gives each document its own URL or file]
    how_to_lift: >
      Copy the placement rules before the section list: owner names and verdicts internal
      only, Things-to-check after the analysis, the shareability sentence at handover.
      The section order transfers to any recurring client-facing analysis.
    provenance: mx-call-brief (field-proven), merged in 2.0.

  - id: figure-battery
    what: >
      The warehouse query battery with its six traps encoded: window alignment to data
      load, like-day-count comparison, dark-day normalization, settled-window efficiency
      verification, SKU-to-account reconciliation, and page-view-weighted Buy Box with a
      last-7-days column.
    home: scripts/pull_figures.py (executable) + references/queries.md (annotated source of record)
    depends_on: [mixshift data query (gateway), Seller Central tables; VC fork documented in the reference]
    how_to_lift: >
      Lift individual queries from references/queries.md with their trap notes attached;
      or run the script whole and consume its JSON. Never lift a query without its trap
      note: the note is the component.
    provenance: mx-call-brief (field-proven); each trap traces to a caught real-account error.

  - id: account-modes
    what: >
      The progressive degrade ladder: Established / No-YoY / Baseline / Setup, resolved
      from the data, named in the scope bar, with ask-instead-of-assert behavior and a
      run-record ledger that makes run N+1 smarter than run N.
    home: SKILL.md "Account modes" + "The run record"
    depends_on: []
    how_to_lift: >
      Copy the mode ladder and the resolution rule (modes come from the data, never from
      config), plus the sidecar ledger shape. Any per-account skill that must work on
      day-zero accounts can adopt it unchanged.
    provenance: 2.0 productization requirement (out-of-box behavior on empty accounts).

  - id: featured-offer-diagnosis
    what: >
      The four-question featured-offer workflow: break/recovery dating from the daily
      series, live offer state, suppression-vs-competitor fork (the fixes differ), and
      the claim-scope rule (read the recovery, not the edit; "consistent with").
    home: SKILL.md Step 6 + Step 3c (the live call)
    depends_on: [live pricing read via the mixshift CLI (pricing.get_item_offers_batch), business-reports daily data]
    how_to_lift: >
      Copy the four questions in order and the suppression fork verbatim. The live-state
      call is the load-bearing half; a warehouse-only version misclassifies recovered
      items and must not claim current state.
    provenance: mx-call-brief (field-proven on real featured-offer incidents).

  - id: brief-template
    what: >
      The instrument-panel design system for both documents: token block, three theme
      states, IBM Plex pairing, tabular-nums figures, severity encoded in form (left
      border + chip + state label), wide tables scrolling in their own container.
    home: assets/brief-template.html (design) + references/brief-structure.md "Design"
    depends_on: []
    how_to_lift: >
      Keep the token block, type pairing and component classes; replace the content.
      Semantic colour carries direction and severity and stays separate from the accent.
    provenance: mx-call-brief (field-proven).

  - id: report-contract
    what: >
      The typed figure/claim contract and its mechanical validators (rule IDs
      BASIS-1..UNIT-1): a document of Figure / Derived / Claim / Caveat / Section
      objects where a number cannot be quoted without its basis, a superlative without
      its complete population, or a caveat-carrying figure without its caveat.
    home: plugins/mixshift-ai/harness/src/lib/report-contract/
    depends_on: [nothing outside the harness; pure functions over a JSON document]
    how_to_lift: >
      Import validateReportData() from the harness lib, or call the CLI door
      (`mixshift report validate <file.json>`). Any skill that emits claims from data
      can adopt the contract wholesale; adopt the fixtures too or the contract is
      decorative. NOTE: as of 2.0 this skill uses the contract's extraction half
      (`report extract --check`, typed figures documents); the claim-object validate and
      render doors are not in this skill's pipeline but remain fully supported and
      borrowable from the harness.
    provenance: >
      Ported from the mpr-v2 handover package (Python executable spec, same rule IDs,
      same 10 fixtures verbatim). Each rule maps to a shipped incident; see
      rules-provenance.md.

  - id: negative-fixtures
    what: >
      The nine shipped claim errors encoded as renders that MUST fail (E1-E9), plus the
      golden-minimal document. Wired as CI: a change that stops one firing fails the
      build.
    home: plugins/mixshift-ai/harness/src/lib/report-contract/fixtures/
    depends_on: [report-contract]
    how_to_lift: >
      Copy the append PROTOCOL, not just the files: every shipped defect in your skill
      becomes a permanent negative fixture, routed by scope (brand -> context,
      universal -> fixture, engine-class -> engine rule). The fixtures themselves are
      report-contract-shaped and only transfer to skills using that contract.
    provenance: mpr-v2 package, verbatim; incident history in rules-provenance.md.

  - id: rules-provenance
    what: >
      The case law: every composition and judgment rule annotated with the real
      incident that created it, plus the live append protocol at the top.
    home: rules-provenance.md (this skill directory)
    depends_on: []
    how_to_lift: >
      The FORMAT is the borrowable part: rule -> incident -> what now enforces it.
      Start your skill's own provenance file with the same three columns; copy the
      append protocol verbatim.
    provenance: mpr-v2 package, verbatim (pre-scrubbed upstream).

  - id: envelope-acquisition
    what: >
      The INS-MONTHLY-01 acquisition pattern: MoM + YoY pairs with ops/ads companions,
      async poll for oversize accounts, degrade-and-label on service error, publish-day
      re-pull + diff (restatement discipline), metered disclosure, probe-before-limit.
    home: SKILL.md Step 3a (pattern) + harness lib/intelligence (the client)
    depends_on: [mixshift intelligence CLI (0.8.7+)]
    how_to_lift: >
      Any skill consuming an INS-* entry: copy Step 3a's structure and keep all four
      behaviors (degrade-and-label, async patience, re-pull+diff, metered disclosure).
      The CLI client is already shared; do not write your own HTTP.
    provenance: house pattern (gateway Phase 2) + mpr-v2 operating notes.

  - id: prose-lint
    what: Writing-quality lint for rendered report HTML (register, banned phrases, voice).
    home: helpers/prose-lint.py
    depends_on: [python3 stdlib only]
    how_to_lift: Copy the file; it is self-contained. Run against rendered HTML, exit 0 gate.
    provenance: mpr-v2 package, verbatim.

  - id: review-manifest
    what: >
      The self-review artifact schema (review.json): substantiation findings + language
      edits as a structured manifest with honest counts.
    home: helpers/mpr-review-schema.json
    depends_on: []
    how_to_lift: Copy the schema; emit it at your own pre-publication gate.
    provenance: mpr-v2 package (v1.4.0 requirement carried forward).

  - id: judgment-rules
    what: >
      The analytical judgment residue: cross-item halo discovery with the
      spend-recommendation guard, event-shift + clean-comparator discipline, cover-build
      direction, probe-before-limit, mechanism-testing (publish the failed test), the
      blended-benchmark non-finding, absolute contributions over growth rates, mix vs
      blended metric labelling, statement-total reconciliation, bid-pullback language.
    home: >
      SKILL.md, distributed where each rule acts: Step 4 (mechanisms + cross-item +
      inventory direction), Step 5 (bid-pullback), Step 7 (events, weak bases,
      statement reconciliation), Step 8 (composition rules).
    depends_on: [an envelope with evidence/halo data for the cross-item pair; otherwise portable prose rules]
    how_to_lift: >
      Text-borrowable per rule. The halo reads require envelope evidence; the writing
      rules transfer to any client-facing report skill unchanged. Check the engine
      version before borrowing a rule the engine may now enforce (their eventual home is
      the engine, not more skills); each rule retires here the release the engine adopts it.
    provenance: mpr-v2 SKILL.md + mx-call-brief, merged in 2.0; incidents in rules-provenance.md.

  - id: commitments-ledger
    what: >
      The prior-call commitments loop: source ladder (own ledger, meeting notes, living
      doc, ask), three data verdicts (landed / not landed / not checkable), daily-series
      check before any verdict, and internal-only placement of owners and scoreboard.
    home: SKILL.md Steps 1 and 5 + "The run record"
    depends_on: [optional meeting-notes MCP; works with none via the ask + sidecar ledger]
    how_to_lift: >
      Copy the source ladder with its graceful bottom (ask one question, run without),
      and the verdict placement rule. The sidecar ledger shape makes any recurring skill
      self-feeding on accounts with no external notes source.
    provenance: mx-call-brief (field-proven); the mid-month-landing false-negative is the case law.

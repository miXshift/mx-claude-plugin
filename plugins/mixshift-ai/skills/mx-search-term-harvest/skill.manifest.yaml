schema_version: 1
skill_id: mx-search-term-harvest
display_name: ST Harvest Extraction
version: "1.1.0"
description: >
  Identifies search terms and ASIN targets converting efficiently under auto or broad match
  that are not yet in explicit keyword targeting. Promotes high-performing auto terms to
  explicit campaigns with bid recommendations and campaign placement guidance. Pure harvest
  logic with no negation or relevance judgment.
run_kind: per_account
cadence: on_demand
risk_tier: 3
allowed_tools: [db_read, file_read, file_write, prefetch]
side_effect_policy: recommendation_only
review_required: always
escalation_conditions:
  - mx-search-term-data-pull artifact absent (upstream dependency not met)
  - harvest candidate matches a negation.protected_term (suppress and surface)
sql_ids:
  - STH-01
pre_execution:
  enabled: true
  artifact_path: "runs/{brand_slug}/{skill_id}/{run_date}/data.json"
  batch_plan:
    - round: 1
      parallel: [STH-01]
      notes: >
        STH-01 returns the explicit-keyword exclusion mask. The ST corpus and
        lifetime performance slices come from the upstream mx-search-term-data-pull
        artifact (consumed via upstream_skills, not prefetched here).
required_context_fields:
  - accounts[*].seller_id
  - management.acos_target_pct
  - sub_brands
  - campaign_structure.naming_pattern
  - campaign_structure.account_codes
  - campaign_structure.objectives
  - brand_terms
  - negation.lane_rules
  - posture.stance
optional_context_fields:
  - corpora   # manual conquest ASIN lists for ASIN harvest cross-reference
  - paused_campaigns   # explicit [] means no known paused campaigns
upstream_skills:
  - mx-search-term-data-pull
artifacts:
  - name: mx-search-term-harvest.html
    type: report_html
verdict_range: [GREEN, YELLOW, RED, OBSERVATIONAL]
pricing_tier: pro
trigger_phrases:
  - run harvest
  - search term harvest
  - keyword harvest
  - auto to explicit
notes: >
  STH-01 pulls the explicit-keyword exclusion mask (all enabled positive keyword targeting
  rows). The skill consumes the mx-search-term-data-pull JSON artifact for the ST corpus and
  lifetime performance slices; it does not run STDP-* queries directly.
  Harvest candidates must be checked against negation.lane_rules mismatch lists before
  promotion to ensure irrelevant terms are not added to explicit campaigns.

# OCL — Objective Level Configuration (the confirm-on-run knobs).
# Harvest qualification ("converting efficiently") is judged against an ACoS
# ceiling; that is the one scalar lever, surfaced as an optional per-skill
# override defaulting to the brand target (Tier-3 context.yaml, else the
# Tier-2 brain). Structured context (lane_rules mismatch lists, brand_terms,
# sub_brands) is read through the resolver, not surfaced here.
calibration:
  schema_version: 1
  fields:
    - id: acos_target
      label: "ACoS target"
      prompt: "ACoS ceiling a term must beat to be a harvest candidate for {brand_name}?"
      help: >
        Auto / broad terms converting at or below this ACoS are promotion
        candidates. Defaults to your brand's ACoS target (Tier-3 context.yaml,
        else the Tier-2 brain). Override only if harvest should use a different
        efficiency bar than the brand default.
      type: percent
      range: { min: 0.05, max: 1.0 }
      seed_from: context.management.acos_target_pct
      required: false

schema_version: 1
skill_id: mx-portfolio-quick-scan
display_name: Portfolio Quick Scan
version: "1.1.0"
description: >
  Multi-account daily triage producing one status card per account answering whether
  platform login is required today. Aggregates mx-daily-health-check sidecars across all
  configured accounts and emits a GREEN, YELLOW, or RED verdict per account plus a
  portfolio-level verdict.
run_kind: portfolio
cadence: daily
risk_tier: 2
allowed_tools: [file_read, file_write]
side_effect_policy: artifact_write
review_required: on_non_green
sql_ids: []   # pure aggregator; consumes mx-daily-health-check sidecars via upstream_skills
required_context_fields:
  - accounts[*].seller_id
  - accounts[*].account_type
  - management.primary_metric
  - management.acos_target_pct
  - management.tacos_in_bottom_line
  - posture.stance
  - posture.multiplier
  - structural_events
  - delivery.reports_local_dir
optional_context_fields:
  - goals.monthly_total_sales_target    # pacing card line when set (was the dead goals.monthly_revenue_target)
  - goals.quarterly_total_sales_target  # quarterly pacing when set (was the dead goals.quarterly_revenue_target)
  - capture_rate_calibration   # VC accounts only, for Adj. ACOS card line
upstream_skills:
  - mx-daily-health-check
artifacts:
  - name: portfolio-scan.html
    type: report_html
verdict_range: [GREEN, YELLOW, RED]
pricing_tier: enterprise
trigger_phrases:
  - run portfolio scan
  - quick check all accounts
  - triage all accounts
  - multi-account check
notes: >
  This skill is a pure aggregator of per-account mx-daily-health-check sidecars; it runs no
  DB queries of its own. Drift-chain detection records the consumption as an
  UPSTREAM:mx-daily-health-check pseudo-entry in the emitted sidecar's sql_calls.
  Sidecar is written with brand_slug=portfolio and run_kind=portfolio.
  If a per-account mx-daily-health-check sidecar is missing or stale (>24h), this skill
  triggers `mixshift prefetch --brand <slug> --skill mx-daily-health-check` in parallel
  across the affected accounts and then runs the per-account skill model to compose
  the sidecar before reading it back here.
  Per-account sidecars belong to the per-account mx-daily-health-check skill, not here.
  TACOS-primary accounts do not require a legacy tacos_reference_line; use
  management.tacos_target_pct/tacos_goal_pct from the per-account context.

schema_version: 1
skill_id: feedback
display_name: Send Feedback to MixShift
version: "0.1.2"
description: >
  Entry point for sending feedback to MixShift, and for catching complaints or
  frustration about the plugin even when the user does not say "feedback" (e.g.
  "this is broken", "this is too slow", "it feels broken", "this is confusing").
  Covers bug reports, feature requests, and comments. Routes through the
  `mixshift feedback` CLI, which sends to the MixShift Discord ops channel +
  records the feedback in Supabase for the engineering team to triage and act
  on. The skill confirms before sending. Works alongside any other skill;
  mid-session feedback is fine. (Troubleshooting "how do I fix X" is mx-help.)

# Modeled as per_account because the trigger_phrases include account-oriented
# entry points; the skill itself is account-agnostic but lives in the
# per-account family for discovery.
run_kind: per_account
cadence: on_demand
risk_tier: 1
allowed_tools: [file_read]
side_effect_policy: none
review_required: never
sql_ids: []

harness_commands:
  - mixshift feedback "<message>" --category <bug|feature_request|comment|other>

required_context_fields: []
optional_context_fields: []
artifacts: []
verdict_range: [OBSERVATIONAL]
pricing_tier: free
trigger_phrases:
  - send feedback
  - send feedback to mixshift
  - submit feedback
  - i have feedback
  - report a bug
  - report bug
  - file a bug
  - bug report
  - feature request
  - i have a feature request
  - i wish this could
  - this is broken
  - this isnt working
  - this is too slow
  - it feels broken
  - this is frustrating
  - this is confusing
  - tell mixshift
  - let mixshift know
  - mixshift feedback
  - rate this plugin
  - flag an issue
notes: >
  Lives at risk_tier 1 -- informational only, no DB calls, no durable artifacts
  on the customer machine. Submits to MixShift's Discord ops channel (real-time
  alert) and Supabase events table (for analyzable feedback firehose).
  Requires the user to be signed in first (via `mixshift auth login`) so we
  have an email to attach to the feedback. If they're not signed in, surface
  that gap and redirect to the mx-auth-login skill.

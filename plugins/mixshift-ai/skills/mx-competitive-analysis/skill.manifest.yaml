schema_version: 1
skill_id: mx-competitive-analysis
display_name: Competitive Analysis
version: "1.1.0"
description: >
  Structured competitive analysis framework for market positioning. Produces SWOT analysis,
  feature comparison matrices, pricing tier breakdowns, and market positioning maps.
  Research-driven assessment of direct competitors and adjacent market players using web
  sources only; no database access required.
run_kind: per_account
cadence: on_demand
risk_tier: 1
allowed_tools: [file_read, file_write, web_search]
side_effect_policy: artifact_write
review_required: never
sql_ids: []   # web research only; no DB queries
required_context_fields: []   # no context.yaml required; inputs are web research
artifacts:
  - name: mx-competitive-analysis.md
    type: narrative_md
verdict_range: [OBSERVATIONAL]
pricing_tier: free
trigger_phrases:
  - competitor analysis
  - competitive landscape
  - market comparison
  - SWOT
  - who competes with us
  - competitive threat analysis
notes: >
  This skill requires no account connection and no database access.
  All research is conducted via web search and public sources.
  Output is saved to ~/.mixshift/competitors/ (user-machine local, portfolio-wide).
  Refresh frequency: 90 days recommended.

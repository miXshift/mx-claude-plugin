schema_version: 1
skill_id: account-cold-start
display_name: Account Cold Start -- Tier 3 Context Builder
version: "2.5.1"
description: >
  Builds a Tier 3 brand context directory for a new Amazon PPC account from scratch.
  Runs structured Phase 0 through Phase 5 collection (web scrub, DB queries, AM intake,
  typed YAML output, deterministic renderer, validator). Produces context.yaml,
  narrative.md, corpora/, and a human-reviewable brand-context.html ("Brand Context
  page") that summarizes what AI knows about the brand, what's missing, and what may
  be stale.
run_kind: per_account
cadence: on_demand
risk_tier: 2
allowed_tools: [db_read, file_read, file_write, renderer, validator, web_search, prefetch]
side_effect_policy: context_write
review_required: always
# Tier 1 context-freshness preflight: cold-start SETS freshness, doesn't consume it.
# Skills that read context.yaml declare a max-days threshold; cold-start is exempt
# so it can refresh stale contexts without being blocked by its own staleness.
context_freshness_max_days: null
sql_ids:
  - CS-01
  - CS-02
  - CS-03
  - CS-04
  - CS-05
  - CS-06
  - CS-07
  - CS-08
  - CS-09
  - CS-10
  - CS-11
  - CS-12
  - CS-13
  - CS-14
  - CS-15
  - CS-16
  - CS-17
  - CS-18
  - CS-19
  - CS-20
  - CS-21
  - CS-22
  - CS-23
  - CS-24
  - CS-25
  - CS-26
  - CS-27
  - CS-28   # v2.3 enrichment -- attribution settlement curve
  - CS-29   # v2.3 enrichment -- stockout window detection
  - CS-30   # v2.3 enrichment -- daily metrics for change-point detection
  - CS-31   # v2.3 enrichment -- brand-name typo corpus
pre_execution:
  enabled: true
  artifact_path: "runs/{brand_slug}/{skill_id}/{run_date}/data.json"
  batch_plan:
    - round: 1
      parallel: [CS-01]
      notes: >
        CS-01 (identity check) must confirm SellerID before any other queries proceed.
        If CS-01 returns 0 rows the brand slug doesn't map to a real account -- stop.
    - round: 2
      parallel: [CS-02, CS-03, CS-04, CS-05, CS-06, CS-07, CS-08, CS-09, CS-10, CS-11, CS-12, CS-13, CS-14, CS-15]
      notes: >
        CS-02 applies to SC; CS-03 applies to VC (both prefetched, skill picks whichever).
        CS-06/CS-07 are attribution-window calibration (SC / VC respectively).
        CS-09/CS-11/CS-12/CS-13 apply to VC only. CS-10 applies to SC only.
        Non-matching queries return empty rows; skill discards.
    - round: 3
      parallel:
        - CS-16
        - CS-17
        - CS-18
        - CS-19
        - CS-20
        - CS-21
        - CS-22
        - CS-23
        - CS-24
        - CS-25
        - CS-26
        - CS-27
        - { id: CS-28, enrichment: true }
        - { id: CS-29, enrichment: true }
        - { id: CS-30, enrichment: true }
        - { id: CS-31, enrichment: true }
      notes: >
        CS-16 through CS-27 are independent structure and calibration queries.
        CS-19/CS-25 apply to VC accounts only; CS-20 applies to SC accounts only.
        CS-16 stub noted -- include for completeness.
        CS-28/29/30/31 are v2.3 enrichment queries (tagged enrichment: true so delta-mode runs
        can filter to them): CS-28 daily attribution settlement curve (campaign type x DOW),
        CS-29 inventory-health historical snapshots for stockout window detection (FBA-only;
        pre-filtered to in-trouble rows), CS-30 daily account ad metrics over trailing 365 days
        for stockout-window impact scoring, CS-31 trailing-90-day converting search-term corpus for
        brand-name typo detection.
post_execution:
  enabled: true
  renderer: brand render-context
  args: ["--brand", "{brand_slug}", "--date", "{run_date}"]
  artifact_path: "clients/{brand_slug}/brand-context.html"
  headline_path: "clients/{brand_slug}/brand-context.headline.json"
  review_path: "clients/{brand_slug}/brand-context.review.json"
  sidecar_path: "clients/{brand_slug}/runs/{skill_id}/{run_date}/{run_id}.json"
  notes: >
    Reads ~/.mixshift/clients/<brand>/{context.yaml, narrative.md, brand-intelligence.yaml,
    corpora/*.csv} plus the schema and audit-labels map. Writes the Brand Context HTML,
    a compact headline.json (~500 tokens), review.json for targeted machine consumption,
    and the run sidecar. The renderer is the single writer of these artifacts --
    the model never edits them manually.
required_context_fields: []   # this skill creates context, not consumes it
optional_context_fields: []
artifacts:
  - name: context.yaml
    type: context_yaml
  - name: narrative.md
    type: narrative_md
  - name: brand-intelligence.yaml
    type: json_artifact   # schema enum lacks yaml type; the file is YAML on disk
  - name: brand-context.html
    type: report_html
  - name: brand-context.headline.json
    type: json_artifact
  - name: brand-context.review.json
    type: json_artifact
  - name: reporting-style.yaml
    type: context_yaml   # optional per-brand monthly report customization
    optional: true
verdict_range: [GREEN, YELLOW, RED, OBSERVATIONAL]
pricing_tier: pro
trigger_phrases:
  - cold start
  - new account setup
  - build brand context
  - account onboarding
  - run cold start
  - kicking off a new client
  - onboarding a brand
  - set up brand context
  - new brand
  - kick off this brand
upstream_skills: []
notes: >
  CS-02 applies to SC; CS-03 applies to VC (model picks based on account_type).
  CS-06/CS-07 are SC vs VC attribution-window calibration.
  CS-09/CS-11/CS-12/CS-13/CS-19/CS-25 apply to VC only.
  CS-10/CS-20 apply to SC only.
  CS-16 references mws_inventory_history (confirmed empty-column stub 2026-04-27);
  included for schema awareness, returns empty for all accounts today.
  CS-28..31 are v2.3 enrichment queries (attribution curve, stockout windows,
  change-point detection, brand typo corpus). The skill model can opt to skip
  them on a first-cold-start run and add them in a delta-mode rerun once the
  base context is approved.

  This skill writes durable artifacts under ~/.mixshift/clients/<brand-slug>/:
  context.yaml, narrative.md, corpora/, plus a human-reviewable brand-context.md
  and machine-readable headline.json + review.json. The skill model is the
  single writer of these artifacts; never edit them manually mid-run.

  Run `mixshift brand validate <brand-slug>` after context.yaml is written to
  confirm it parses cleanly against the Zod schema before declaring complete.

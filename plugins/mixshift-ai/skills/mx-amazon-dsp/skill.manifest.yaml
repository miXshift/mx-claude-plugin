schema_version: 1
skill_id: mx-amazon-dsp
display_name: Amazon DSP (reports + live account reads)
version: "0.2.0"
description: >
  Read an Amazon DSP (Demand-Side Platform) advertiser straight from Amazon
  through MixShift's service. Two surfaces, addressed differently. REPORTING is
  the async loop: build a report request (type + dimensions + metrics), submit,
  poll to completion across turns, fetch the JSON. ACCOUNT READS answer what is
  set up right now: campaigns and line items, the advertiser's creatives
  (including ones built in the DSP console), which creatives are attached to
  which line items and whether each placement is live or paused, whether a
  placement was approved or rejected, and which creatives Amazon considers
  eligible for a given line item. Also owns discovering which DSP advertiser a
  login can reach, the step most DSP work gets stuck on. Read-only throughout:
  nothing here mutates an advertiser and no write scope is needed. Creating or
  attaching a DSP creative is NOT available. Routes through the bundled harness
  CLI. Does not require brand setup, only that the user has signed in
  (`mixshift auth login`).

# Tier 1 = informational, read-only against Amazon and the service. Requesting
# a DSP report returns aggregated performance data and mutates nothing
# advertiser-facing, so no write scope and no --commit. Modeled as per_account
# because every call targets a specific merchant login
# (legacySellerId / amazonSellerId), though no brand context is consumed.
run_kind: per_account
cadence: on_demand
risk_tier: 1
allowed_tools: [file_read, file_write]
side_effect_policy: artifact_write   # saves DSP report JSON to ~/.mixshift/reports/
review_required: never
sql_ids: []   # no warehouse SQL; data comes from the Amazon DSP reporting API

# Harness commands the skill calls (DSP is the DSP family inside `ads call`;
# there is no dedicated `dsp` subcommand).
# NOTE the two parameter names: the report operations take --path accountId=,
# the /dsp/v1 account reads take --path advertiserId=. Same value, different
# name per surface. The two discovery operations are in the Accounts family, so
# `ads operations --family DSP` does not list them.
harness_commands:
  - mixshift ads profiles
  - mixshift ads operations --family DSP
  - mixshift ads call accounts.list_manager_accounts
  - mixshift ads call accounts.query_advertiser_accounts
  - mixshift ads call dsp.create_report --path accountId= --body-file <file>
  - mixshift ads call dsp.get_report --path accountId= --path reportId=
  - mixshift ads call dsp.list_campaigns --path advertiserId= --body <json>
  - mixshift ads call dsp.list_ad_groups --path advertiserId= --body <json>
  - mixshift ads call dsp.list_ad_creatives --path advertiserId= --body <json>
  - mixshift ads call dsp.list_creative_associations --path advertiserId= --body <json>
  - mixshift ads call dsp.list_association_moderations --path advertiserId= --body <json>
  - mixshift ads call dsp.get_ad_creative_validation --path advertiserId= --path adCreativeId=
  - mixshift ads call dsp.list_eligible_creatives --path advertiserId= --body <json>

required_context_fields: []
optional_context_fields: []
artifacts:
  - name: dsp-report
    type: json_artifact   # DSP returns a presigned url; the report is fetched to disk as JSON.
verdict_range: [OBSERVATIONAL]
pricing_tier: free
trigger_phrases:
  - pull a dsp report
  - amazon dsp report
  - dsp campaign report
  - dsp reporting
  - dsp performance
  - get dsp data
  - dsp audience report
  - dsp inventory report
  - run a dsp report
  - dsp advertiser report
  - dsp creatives
  - dsp line items
  - dsp ad groups
  - what creatives are running on dsp
  - why is my dsp creative not delivering
  - dsp creative approval
  - is this creative eligible for dsp
  - audit dsp account
  - find my dsp advertiser id
notes: >
  Auth model: DSP rides the Amazon Ads API, whose tokens are PER ADVERTISING
  LOGIN (not per seller). The service reads the tenant's stored advertising
  refresh token and mints access tokens in memory; the plugin never holds Ads
  secrets. Merchant selection mirrors the other Ads surfaces: prefer
  `--legacy-seller-id` (deterministic, same ids as `amazon merchants`), or pass
  `--seller-id` together with `--marketplace`. Ambiguity returns
  merchant_not_found (exit 7) with candidates.

  Two distinct ids: `--legacy-seller-id` selects which advertising LOGIN's token
  the service uses; the DSP advertiser id says which advertiser to act on. It is
  NOT the profileId or legacySellerId, its width varies (13 and 18 digits both
  occur, so never validate by length), and it is not the ENTITY... id beside it,
  which Amazon rejects.

  THE TWO DSP FAMILIES TAKE IT UNDER DIFFERENT PARAMETER NAMES, which is the
  usual first failure: the v3 report operations take `--path accountId=<id>`
  and are profile-scoped, while the /dsp/v1 account reads take
  `--path advertiserId=<id>`, send no profile scope, and require it on every
  call. Same value, two names, because Amazon names it differently per surface.

  Discovery is accounts.list_manager_accounts -> linkedAccounts rows of type
  DSP_ADVERTISING_ACCOUNT (authoritative, no parameters), with
  accounts.query_advertiser_accounts as a second source when that looks
  incomplete (query BOTH global filters and page both, or it appears to show no
  DSP when the advertiser is present). De-duplicate by dspAdvertiserId: one
  advertiser is commonly linked under several manager accounts. Do NOT infer
  "has DSP" from the count of agency-type profiles; most agency profiles are
  Amazon Attribution, and an account with none can still hold DSP advertisers.

  Brand -> advertiser has NO reliable automatic mapping: the sponsored and DSP
  records share no identifier, so have the user confirm which advertiser they
  mean rather than guessing.

  DSP reporting is its own endpoint (/accounts/{accountId}/dsp/reports) with a
  type / dimensions / metrics body, distinct from Sponsored Ads v3 reporting
  (configuration / reportTypeId / columns) and the unified /adsApi/v1 reporting.
  Validated live 2026-06-14 (service: vnd type on Accept, body application/json).

  The /dsp/v1 account reads (campaigns, ad groups, creatives, creative
  associations, moderations, creative validation, eligible creatives) were
  validated live 2026-08-28. Read-only; there is no create/attach path for DSP
  creatives, and the skill says so rather than improvising one. Three traps the
  skill body covers because each yields a confident wrong answer: a creative
  carries NO state (live-vs-paused belongs to its ASSOCIATION to a line item);
  ad-group inventoryType, creative adCreativeFormatType and creative
  adExperience are three separate enums that share no values, so ONLINE_VIDEO
  line items are served by VIDEO-typed creatives; and an empty body returns ONE
  row rather than a first page, while the truncation signal differs per
  operation.

  Report shape: body { startDate, endDate, type, dimensions, metrics }. Types:
  CAMPAIGN (dimensions ORDER/LINE_ITEM/CREATIVE, the validated known-good
  shape), INVENTORY, AUDIENCE, PRODUCT, GEOGRAPHY, TECHNOLOGY, REACH. Each type
  has its own valid dimensions + a large (hundreds) metric vocabulary; pick a
  small intentional metric set and confirm non-CAMPAIGN combinations against
  Amazon's reference. A FAILURE status is usually an invalid dimension/metric
  for the type or a date range outside retention.

  Lifecycle: dsp.create_report returns a reportId (status IN_PROGRESS). Poll
  dsp.get_report ACROSS TURNS (IN_PROGRESS -> SUCCESS | FAILURE; no sleep-loops
  in one Bash call). On SUCCESS the payload carries a presigned `location` url:
  fetch it WITHOUT auth headers (it expires in ~1 hour; re-poll for a fresh one
  if it lapses). The downloaded report is JSON.

  Required state (not modeled in schema fields):
    - ~/.mixshift/auth/credentials must exist (run `mixshift auth login`)
    - Amazon Ads enabled for the tenant; calls fail with ads_not_configured
      otherwise (user contacts MixShift ops).
    - The advertising login must hold DSP access for the advertiser; a 403 on
      create/get usually means a missing seat or a region mismatch.

  DSP report files land at
  ~/.mixshift/reports/<merchant>/<date>-dsp-<type>.json.

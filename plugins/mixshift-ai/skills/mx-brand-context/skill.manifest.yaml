schema_version: 1
skill_id: mx-brand-context
display_name: Brand Context Setup
version: "2.8.0"
description: >
  Brand Context setup: onboards a brand by building its Tier 3 brand context directory
  for a new Amazon PPC account from scratch (formerly mx-account-cold-start).
  Runs structured Phase 0 through Phase 5 collection (web scrub, DB queries, AM intake,
  typed YAML output, deterministic renderer, validator). Produces context.yaml,
  narrative.md, corpora/, and a human-reviewable brand-context.html ("Brand Context
  page") that summarizes what AI knows about the brand, what's missing, and what may
  be stale.
run_kind: per_account
cadence: on_demand
risk_tier: 2
allowed_tools: [db_read, file_read, file_write, renderer, validator, web_search, prefetch]
side_effect_policy: context_write
review_required: always
# Tier 1 context-freshness preflight: cold-start SETS freshness, doesn't consume it.
# Skills that read context.yaml declare a max-days threshold; cold-start is exempt
# so it can refresh stale contexts without being blocked by its own staleness.
context_freshness_max_days: null
# v2.6.0: the Tier-2 Brand Brain (brand-brain.yaml, auto-filled on `brand key
# add`) now supplies taxonomy (sub_brands / item_groups / top_asins),
# campaign-structure distincts (+ objective_tag_completeness_pct, the CS-27
# substitute), and the three enrichment analyses (capture_rate_calibration +
# daily_settlement_curve, stockouts, brand_term_typos). The deep skill READS
# those from the brain and no longer re-derives them, so the heuristic +
# enrichment CS-* queries left this prefetch. Retired: CS-01 (identity — the
# brand is bootstrapped before cold-start; the Phase 1 gate now checks the
# registry/brain), CS-10/CS-19/CS-20 (taxonomy → brain catalog), CS-16/CS-21/
# CS-25 (skill-level diagnostics → brain stockout / not needed), CS-27
# (objective completeness → brain objective_tag_completeness_pct), and the
# enrichment family CS-06/CS-07/CS-08/CS-28/CS-29/CS-30/CS-31 (→ brain
# capture_rate_calibration / stockouts / brand_term_typos). CS-09 (VC
# sub-brand × item-group cross + per-pair target ACOS) and CS-24 (per-campaign
# spend/ACOS dimensions) are KEPT: the brain's flat distinct sets lose the
# cross-structure CS-09 carries and the per-campaign grain CS-24 carries, which
# is what the skill resolves objectives from (and what drives the
# label_completeness coverage gap text).
# The remaining queries are the historical baselines the deep skill still pulls
# at runtime. Catalog entries for the retired enrichment queries are KEPT —
# the brain consumes them.
#
# Phase 0.4 (mx-ops#17 slice 4b, fb-78913 "port before intake"): PORT-01
# (portfolio taxonomy) and PORT-02 (Dash context-field coverage audit) are
# NEW gateway-native entries (born dispatch:named, no public .sql ancestor —
# see shared/sql-library/catalog.yaml), added to Round 1 below so Phase 0.4
# can pre-fill/confirm the Phase 2 questions they answer instead of asking
# the AM cold. Neither is SC/VC-conditional or brain-derived; both are new
# reads the brain does not carry.
sql_ids:
  - CS-02
  - CS-03
  - CS-04
  - CS-05
  - CS-09
  - CS-11
  - CS-12
  - CS-13
  - CS-14
  - CS-15
  - CS-17
  - CS-18
  - CS-22
  - CS-23
  - CS-24
  - CS-26
  # Phase 0.4 (mx-ops#17 slice 4b, US3 port step): portfolio taxonomy +
  # Dash context-field coverage audit, both born dispatch:named (no public
  # .sql ancestor). Ride Round 1 below — no separate fetch, no extra wait.
  - PORT-01
  - PORT-02
pre_execution:
  enabled: true
  artifact_path: "runs/{brand_slug}/{skill_id}/{run_date}/data.json"
  batch_plan:
    - round: 1
      parallel: [CS-02, CS-03, CS-04, CS-05, CS-09, CS-11, CS-12, CS-13, CS-14, CS-15, PORT-01, PORT-02]
      notes: >
        Identity is no longer a prefetch round — the brand is bootstrapped
        (registry + brain) before cold-start runs, and the Phase 1 hard gate
        checks the registry/brain instead of CS-01. These are the revenue,
        ACOS, and structure baselines: CS-02 applies to SC; CS-03 applies to VC
        (both prefetched, skill picks whichever). CS-09/CS-11/CS-12/CS-13 apply
        to VC only. Non-matching queries return empty rows; skill discards.
        PORT-01 (portfolio taxonomy: named portfolios plus synthetic
        (no portfolio)/(orphaned portfolio) bucket rows, three-way partition
        of the enabled/paused campaign universe) and PORT-02 (13-row Dash
        context-field coverage audit: campaign Objective/ItemGroup/Tag1-4,
        mws_items Brand/ItemGroup/TargetACOS/TargetTACOS/ItemCost/LeadTime,
        seller ACOSTarget) are seller-level, not VC/SC-conditional, so both
        run every time. Phase 0.4 reads them from this same Round 1 output
        before Phase 2 intake opens; see SKILL.md Phase 0.4 for the read/parse
        contract.
    - round: 2
      parallel: [CS-17, CS-18, CS-22, CS-23, CS-24, CS-26]
      notes: >
        Independent structure + calibration baselines. CS-26 applies to VC
        accounts only. CS-24 returns per-campaign spend/ACOS dimensions; the
        SKILL resolves each campaign's objective from them (account label, then
        CampaignType, then name-segment vocabulary) and reports a spend-weighted
        coverage percentage as the standardized label_completeness gap text. The
        brain's distinct_objectives + objective_tag_completeness_pct do not
        reproduce the per-campaign grain. Taxonomy, brand
        terms, attribution/settlement calibration, stockout windows, and
        brand-term typos are read from the Brand Brain, not re-pulled here.
post_execution:
  enabled: true
  renderer: brand render-context
  args: ["--brand", "{brand_slug}", "--date", "{run_date}"]
  artifact_path: "clients/{brand_slug}/brand-context.html"
  headline_path: "clients/{brand_slug}/brand-context.headline.json"
  review_path: "clients/{brand_slug}/brand-context.review.json"
  sidecar_path: "clients/{brand_slug}/runs/{skill_id}/{run_date}/{run_id}.json"
  notes: >
    Reads ~/.mixshift/clients/<brand>/{context.yaml, narrative.md, brand-intelligence.yaml,
    corpora/*.csv} plus the schema and audit-labels map. Writes the Brand Context HTML,
    a compact headline.json (~500 tokens), review.json for targeted machine consumption,
    and the run sidecar. The renderer is the single writer of these artifacts --
    the model never edits them manually.
required_context_fields: []   # this skill creates context, not consumes it
optional_context_fields: []
artifacts:
  - name: context.yaml
    type: context_yaml
  - name: narrative.md
    type: narrative_md
  - name: brand-intelligence.yaml
    type: json_artifact   # schema enum lacks yaml type; the file is YAML on disk
  - name: brand-context.html
    type: report_html
  - name: brand-context.headline.json
    type: json_artifact
  - name: brand-context.review.json
    type: json_artifact
  - name: reporting-style.yaml
    type: context_yaml   # optional per-brand monthly report customization
    optional: true
verdict_range: [GREEN, YELLOW, RED, OBSERVATIONAL]
pricing_tier: pro
trigger_phrases:
  # Primary "Brand Context" phrasings (renamed surface)
  - set up <brand>
  - set up brand context
  - build brand context
  - build brand context for <brand>
  - onboard <brand>
  - onboarding a brand
  - new account setup
  - account onboarding
  - new brand
  - kick off this brand
  - kicking off a new client
  # Legacy input aliases: users who learned the old "cold start" term must
  # still route here. Accepted as INPUT only — never emit "cold start" in
  # plugin output copy; the process is called "brand setup" in chat.
  - cold start
  - run cold start
upstream_skills: []
notes: >
  Source split (v2.6.0): the Tier-2 Brand Brain supplies brand taxonomy
  (catalog.sub_brands / item_groups / top_asins), campaign-structure distincts
  (+ objective_tag_completeness_pct, the CS-27 substitute), and the three
  enrichment analyses (capture_rate_calibration incl. daily_settlement_curve,
  stockouts, brand_term_typos). The deep skill reads those from the brain and
  confirms/enriches them into Tier-3; the prefetch queries above are the
  historical baselines it still pulls at runtime.

  CS-02 applies to SC; CS-03 applies to VC (model picks based on account_type).
  CS-09/CS-11/CS-12/CS-13/CS-26 apply to VC only.
  CS-24 returns per-campaign spend/ACOS dimensions that the skill resolves
  objectives from, and drives the standardized label_completeness coverage gap
  text — the brain's distinct_objectives do not reproduce that per-campaign
  grain, so it stays a runtime pull.

  PORT-01/PORT-02 (Phase 0.4, mx-ops#17 slice 4b) are the "existing context
  port" step's data: PORT-01 is portfolio taxonomy (named portfolios plus
  synthetic (no portfolio)/(orphaned portfolio) buckets that three-way
  partition the enabled/paused campaign universe); PORT-02 is a 13-row
  Dash context-field coverage audit (campaign Objective/ItemGroup/Tag1-4,
  mws_items Brand/ItemGroup/TargetACOS/TargetTACOS/ItemCost/LeadTime, seller
  ACOSTarget). Both are read before Phase 2 so populated platform fields get
  pre-filled/confirmed instead of asked, and 0-coverage fields are explained
  as "never configured in the platform" rather than treated as a data gap.

  This skill writes durable artifacts under ~/.mixshift/clients/<brand-slug>/:
  context.yaml, narrative.md, corpora/, plus a human-reviewable brand-context.html
  and machine-readable headline.json + review.json. The skill model is the
  single writer of these artifacts; never edit them manually mid-run.

  Run `mixshift brand validate <brand-slug>` after context.yaml is written to
  confirm it parses cleanly against the Zod schema before declaring complete.

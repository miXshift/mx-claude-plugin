schema_version: 1
skill_id: mx-amazon-amc
display_name: Amazon Marketing Cloud Ad-hoc Analytics
version: "0.2.1"
description: >
  Run ad-hoc Amazon Marketing Cloud (AMC) SQL analytics for a merchant, on
  demand, straight from Amazon through MixShift's service. Drives the full AMC
  loop: discover the AMC instances an advertising login can reach, inspect the
  data sources, author dialect-correct AMC SQL, submit a workflow execution,
  poll it to completion across turns, and fetch the CSV results. Also the
  surface for the paid Amazon Retail Purchases dataset
  (`amazon_retail_purchases`), which covers every Amazon store purchase whether
  or not an ad was involved and across a far longer history than the
  ad-attributed tables: use it for customer lifetime value, revenue and repeat
  rate by ASIN, acquisition cohorts, and repeat-purchase analysis. Read-only:
  running a query mutates nothing advertiser-facing and needs no write scope.
  Routes through the bundled harness CLI. Does not require brand setup,
  only that the user has signed in (`mixshift auth login`).

# Tier 1 = informational, read-only against Amazon and the service. Submitting
# and running an AMC workflow returns aggregated clean-room results and mutates
# nothing advertiser-facing, so no write scope and no --commit. Modeled as
# per_account because every call targets a specific merchant
# (legacySellerId / amazonSellerId), though no brand context is consumed.
run_kind: per_account
cadence: on_demand
risk_tier: 1
allowed_tools: [file_read, file_write]
side_effect_policy: artifact_write   # saves AMC result CSVs to ~/.mixshift/reports/
review_required: never
sql_ids: []   # AMC SQL is authored ad-hoc per request; no library SQL

# Harness commands the skill calls (AMC is the AMC family inside `ads call`;
# there is no dedicated `amc` subcommand).
harness_commands:
  - mixshift ads profiles
  - mixshift ads operations --family AMC
  - mixshift ads call amc.list_accounts
  - mixshift ads call amc.list_instances --path entityId= --path marketplaceId=
  - mixshift ads call accounts.query_advertiser_accounts
  - mixshift ads call amc.get_instance --path instanceId= --path entityId=
  - mixshift ads call amc.list_data_sources --path instanceId= --path entityId=
  - mixshift ads call amc.get_data_source --path instanceId= --path entityId= --path dataSourceName=
  - mixshift ads call amc.create_workflow_execution --path instanceId= --path entityId= --body-file <file>
  - mixshift ads call amc.get_workflow_execution --path workflowExecutionId=
  - mixshift ads call amc.get_download_urls --path workflowExecutionId=

required_context_fields: []
optional_context_fields: []
artifacts:
  - name: amc-result
    type: json_artifact   # AMC returns CSV download urls; fetched to disk. Closest schema type.
verdict_range: [OBSERVATIONAL]
pricing_tier: free
trigger_phrases:
  - run an amc query
  - amazon marketing cloud query
  - amc analytics
  - amc workflow
  - amc clean room
  - query amazon marketing cloud
  - list my amc instances
  - what amc instances do I have
  - amc data sources
  - submit an amc workflow
  - amc sql
  - pull retail purchases
  - amazon retail purchases
  - retail purchases data set
  - customer lifetime value
  - ltv by asin
  - purchase cohorts
  - repeat purchase analysis
notes: >
  Auth model: AMC rides the Amazon Ads API, whose tokens are PER ADVERTISING
  LOGIN (not per seller). The service reads the tenant's stored advertising
  refresh token and mints access tokens in memory; the plugin never holds Ads
  secrets. Merchant selection mirrors the other Ads surfaces: prefer
  `--legacy-seller-id` (deterministic, same ids as `amazon merchants`), or pass
  `--seller-id` together with `--marketplace`. Ambiguity returns
  merchant_not_found (exit 7) with candidates.

  AMC header model: AMC calls are NOT profile-scoped. The entity id (an
  advertiser id) rides as `--path entityId=...` and is sent as a header; the
  marketplace id defaults to the resolved seller row's marketplace but is
  overridable with `--path marketplaceId=...` when the AMC account's
  marketplace differs from the seller row's. instanceId and
  workflowExecutionId fill templated paths. The caller always passes these as
  `--path k=v`; the service decides header vs path placement per operation.

  Discovery chain (in order): amc.list_accounts (no params, no entity header)
  gives entity ids + marketplaces; amc.list_instances per
  (entityId, marketplaceId) pair gives instanceIds and MUST be probed
  SEQUENTIALLY (parallel probing trips 429s; 401/403/404 means no access for
  that pair and is normal); accounts.query_advertiser_accounts is the fallback
  for self-service Sponsored Ads entityIds (different client-id header; query
  global AND non-global; empty pages with a valid nextToken are normal, keep
  iterating); then schema discovery, which is amc.get_data_source for a table
  you can already name and amc.list_data_sources (PAGED - limit caps at 100 and
  an instance holds far more) when exploring.

  Paid datasets: some AMC tables require a subscription the advertiser holds,
  and querying one without it fails at COMPILE TIME with a message that never
  names the subscription, so it reads as broken SQL. amc.get_instance returns
  instance.optionalDatasets; the label PURCHASE_RETAIL_PROGRAM means
  amazon_retail_purchases is queryable. Subscriptions are time-limited, so
  re-check this first when a working query starts failing.

  AMC SQL dialect (FAILED executions are usually dialect violations): declare
  every CUSTOM_PARAMETER in workflow.inputParameters (array params need
  elementDataType + elementNullable); NTILE is unsupported (manual quartiles
  via ROW_NUMBER + CEIL); COUNT(*) OVER () is rejected (use COUNT(col) OVER ());
  no computed expressions inside COLLECT (pre-compute in a CTE, then COLLECT the
  column).

  Aggregation thresholds are a CLEAN-ROOM rule about the result set, not a SQL
  rule, and they are the most common reason a valid query is rejected:
  shopper-level ids (user_id, purchase_id, event_id, session ids) may be
  grouped and joined inside CTEs but must never reach the final SELECT, and AMC
  suppresses rows built from too few distinct users, so an empty segment can be
  a privacy floor rather than missing data.

  amazon_retail_purchases (the long-window paid dataset behind lifetime value,
  repeat purchase and cohorts) has its own reference at
  references/amazon-retail-purchases.md: full column list with the output rules
  the API does not return, five column traps that silently produce wrong
  answers (purchase_date_utc not event_dt_utc; revenue is unit_price *
  purchase_units_sold with no total column; purchase_month_utc is 1-12 not
  YYYYMM; one purchase_id spans many event_id rows so orders are
  COUNT(DISTINCT purchase_id); unit_price is LOCAL currency and AMC cannot
  convert, so filter or group on marketplace_name before summing money),
  and three query recipes of which ONE is verified live and two are not.

  Lifecycle: amc.create_workflow_execution (body: workflow.sqlQuery + optional
  inputParameters; timeWindowType EXPLICIT | MOST_RECENT_DAY | MOST_RECENT_WEEK;
  timeWindowStart/End/TimeZone; parameterValues) returns a workflowExecutionId.
  Poll amc.get_workflow_execution ACROSS TURNS (PENDING, RUNNING, SUCCEEDED,
  CANCELLED, REJECTED (the clean-room refusal: coarsen the grouping or widen the
  window, do not retry unchanged),
  FAILED; no sleep-loops in one Bash call). On SUCCEEDED, amc.get_download_urls
  returns presigned CSV urls that EXPIRE IN MINUTES: fetch them immediately and
  WITHOUT auth headers, before summarizing anything; re-call for a fresh set if
  they lapse.

  Required state (not modeled in schema fields):
    - ~/.mixshift/auth/credentials must exist (run `mixshift auth login`)
    - Amazon Ads enabled for the tenant; calls fail with ads_not_configured
      otherwise (user contacts MixShift ops).

  AMC result CSVs land at
  ~/.mixshift/reports/<merchant>/<date>-amc-<workflow>.csv.

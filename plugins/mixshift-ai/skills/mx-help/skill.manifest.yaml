schema_version: 1
skill_id: mx-help
display_name: Help / Navigation Hub
version: "0.1.0"
description: >
  Navigation and discovery hub for the plugin. Renders an outcome-grouped map
  of every skill via the `mixshift guide` CLI, routes the user to the right
  skill, runs `mixshift doctor` for troubleshooting, and points outward to
  feedback (mx-feedback) and skill sharing (mx-share-skill). The ongoing
  "I'm stuck / what can this do / how do I fix X" entry point, distinct from
  the first-run mx-welcome.

# Tier 1 = informational only. No file writes, no DB calls. Modeled as
# per_account for discovery, consistent with mx-welcome / mx-feedback; the
# skill itself is account-agnostic.
run_kind: per_account
cadence: on_demand
risk_tier: 1
allowed_tools: [file_read]   # invokes `mixshift guide` / `mixshift doctor`; reads no files itself
side_effect_policy: none
review_required: never
sql_ids: []

harness_commands:
  - mixshift guide --format chat
  - mixshift doctor

required_context_fields: []
optional_context_fields: []
artifacts: []
verdict_range: [OBSERVATIONAL]
pricing_tier: free
trigger_phrases:
  - help
  - i need help
  - im stuck
  - i'm stuck
  - i'm lost
  - what can you do
  - what can this do
  - what can this plugin do
  - what can i do here
  - what are my options
  - how do i
  - where do i find
  - where is
  - show me what's available
  - list skills
  - list the skills
  - what skills are there
  - how do i fix
  - navigate
  - capabilities
notes: >
  Thin skill wrapping the `mixshift guide` CLI command (named `guide` because
  the CLI framework reserves `help`). The CLI owns the capability-map wording,
  built from an editorial catalog that is cross-checked against the on-disk
  skills so a new skill is never silently missing. On the web path (no shell),
  the SKILL.md instructs Claude to present the map from the available skills it
  can see. Routes to mx-auth-login / mx-welcome for setup, mx-feedback for bugs
  and requests, mx-share-skill for contributions.

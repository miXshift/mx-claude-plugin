# Plugin-shipped defaults for the mixshift-ai plugin.
#
# These are MixShift deployment values that every user gets out of the box.
# They are committed to the repository and ship with plugin releases.
#
# Users can override any value:
#   - Via env var (e.g. MIXSHIFT_DISCORD_WEBHOOK)
#   - Via .env.local at ~/.mixshift/.env.local or repo root (loaded at startup)
#   - Via CLI flag (--webhook-url, ...)
#
# Resolution priority: CLI flag > env var > .env.local > this file.

schema_version: 1

# Discord routing for ops alerts (IP whitelist requests, user feedback,
# table-access requests, plugin crashes) is server-side. The plugin POSTs
# every event to the Supabase `events` table; a database trigger calls
# the `fanout-discord` Edge Function which reads the Discord webhook URL
# from the function's secrets (set once via the Supabase dashboard) and
# posts to the ops channel. No Discord URL ever lives in the plugin.
#
# Setup: internal/SUPABASE-SETUP.md §10 documents the Edge Function,
# the database trigger, and the secret pattern. internal/SECRETS.md
# documents which fields are secrets and which aren't.
auth:
  public_ip_lookup_url: https://api.ipify.org?format=json

  # MySQL connection defaults — used as suggested values in the auth-setup
  # prompts. The credentials page on mydashapplications.com is the source
  # of truth: the user copies the actual values from there.
  #
  # Host: most users get db.mydashapplications.studio, but some tenants
  # have a tenant-specific subdomain like marpartners.mydashapplications.studio.
  # The credentials page shows the actual host for the user's account.
  #
  # Port: 3306 is universal.
  #
  # Database: typically matches the user's MySQL username (e.g. user
  # "marpartners" → schema "marpartners"). The harness pre-fills the
  # database prompt with whatever the user typed for username, which is
  # correct for most accounts. Users with a different schema (Sam's `dash`
  # user → `dashamazon` schema is the canonical outlier) override at the
  # prompt.
  mysql:
    host: db.mydashapplications.studio
    port: 3306
    database: dashamazon

  # How the user retrieves their MySQL credentials (legacy raw-MySQL flow).
  # Surfaced by `mixshift auth setup` so users see the URL when they need
  # it. Token-based sign-in (`mixshift auth login`) is the default path now
  # and does not use this block.
  credential_retrieval:
    url_default: https://www.mydashapplications.com/database-admin
    url_tenant_pattern: https://<your-company>.mydashapplications.com/database-admin
    notes: |
      The `www` URL works for most users via the wildcard SSL on
      mydashapplications.com. If it doesn't recognize your logged-in
      session, use your tenant subdomain instead (e.g.
      marpartners.mydashapplications.com/database-admin).

# Telemetry destination.
#
# Default: the MixShift gateway ingest at mcp.mixshift.io, which forwards
# events server-side to the analytics store. This rides the ONE domain every
# install already needs (sandboxed and scheduled runs can reach it, so their
# telemetry and `mixshift feedback` actually deliver instead of queueing
# forever), and it keeps the storage credential out of the shipped plugin.
#
# When `endpoint` or `apikey` is empty, telemetry is "configured off": events
# are written to the local queue file (~/.mixshift/telemetry/queue.jsonl) but
# never flushed to the network. Both values below must therefore stay
# non-empty. The gateway ignores the apikey header entirely; `mx-gateway` is
# a placeholder that satisfies the non-empty gate, not a secret.
#
# Direct-to-store override (internal/dev): set MIXSHIFT_TELEMETRY_ENDPOINT to
# a PostgREST events URL and MIXSHIFT_TELEMETRY_APIKEY to that project's anon
# key. Users can disable telemetry with `mixshift telemetry opt-out` or
# MIXSHIFT_TELEMETRY=0.
#
# Setup: see internal/SUPABASE-SETUP.md.
telemetry:
  enabled: true
  endpoint: https://mcp.mixshift.io/telemetry/events
  apikey: mx-gateway
  batch_size: 10
  flush_interval_ms: 5000

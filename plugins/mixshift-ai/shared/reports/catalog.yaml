  # =========================================================================
  # Brand Analytics (JSON) — requires Brand Registry enrollment on the
  # merchant. If not enrolled, expect restricted_report from the service.
  # =========================================================================
  - report_type: GET_BRAND_ANALYTICS_SEARCH_TERMS_REPORT
    title: Brand Analytics — Search Terms
    purpose: Top search terms with the top 3 clicked ASINs + click/conversion share. Keyword-demand intelligence.
    applies_to: seller
    document_format: json
    window: required
    window_notes: Window must align to the reportPeriod boundary (week/month/quarter).
    warehouse_coverage: none
    group: Brand Analytics
    report_options:
      - key: reportPeriod
        example: WEEK
        note: WEEK | MONTH | QUARTER. start/end must align to this period.
    parse_hints: JSON with a dataByDepartmentAndSearchTerm[] (or similar) array; each row has searchTerm + ranked clicked ASINs.
    notes: Requires Brand Registry. Not enrolled -> restricted_report. No server-side filter; the whole marketplace term set comes back (can be very large -> always pull with --out).

  - report_type: GET_BRAND_ANALYTICS_SEARCH_CATALOG_PERFORMANCE_REPORT
    title: "Brand Analytics: Search Catalog Performance"
    purpose: Per-ASIN search-funnel performance for your catalog. Shows how your products perform across the search terms shoppers used to find them. Supports an ASIN filter.
    applies_to: seller
    document_format: json
    window: required
    window_notes: Window must align to the reportPeriod boundary. A WEEK window must run Sunday to Saturday and cannot span two periods.
    warehouse_coverage: none
    group: Brand Analytics
    report_options:
      - key: reportPeriod
        example: WEEK
        note: WEEK | MONTH | QUARTER. start/end must align to this period.
      - key: asins
        example: B0XXXX1111 B0XXXX2222
        note: Optional. Space-separated ASIN list, a REAL server-side filter that narrows the report to just those products. This is the clean way to filter to a set of products (the Search Terms report has no such filter).
    parse_hints: JSON with per-ASIN search-funnel rows (impressions/clicks/cart-adds/purchases + share) for the period.
    notes: Requires Brand Registry. Not enrolled -> restricted_report.

  - report_type: GET_BRAND_ANALYTICS_SEARCH_QUERY_PERFORMANCE_REPORT
    title: Brand Analytics — Search Query Performance
    purpose: Per-query funnel for your brand's ASINs — impressions, clicks, cart-adds, purchases + share.
    applies_to: seller
    document_format: json
    window: required
    window_notes: Window aligns to reportPeriod.
    warehouse_coverage: none
    group: Brand Analytics
    report_options:
      - key: reportPeriod
        example: WEEK
        note: WEEK | MONTH | QUARTER.
    parse_hints: JSON with per-query funnel objects (impression/click/cartAdd/purchase counts + median price + share).
    notes: Requires Brand Registry. Not enrolled -> restricted_report.

  - report_type: GET_BRAND_ANALYTICS_MARKET_BASKET_REPORT
    title: Brand Analytics — Market Basket
    purpose: Products most often purchased together with your ASINs. Cross-sell/bundle insight.
    applies_to: seller
    document_format: json
    window: required
    window_notes: Window aligns to reportPeriod.
    warehouse_coverage: none
    group: Brand Analytics
    report_options:
      - key: reportPeriod
        example: MONTH
        note: WEEK | MONTH | QUARTER.
    parse_hints: JSON with purchased-together pairs + combination %.
    notes: Requires Brand Registry.

  - report_type: GET_BRAND_ANALYTICS_REPEAT_PURCHASE_REPORT

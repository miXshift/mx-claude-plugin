    purpose: XML form of the pending-orders snapshot.
    applies_to: seller
    document_format: tsv
    window: forbidden
    warehouse_coverage: none
    group: Orders
    report_options: []
    parse_hints: Bytes are XML; parse accordingly.

  - report_type: GET_CONVERGED_FLAT_FILE_PENDING_ORDERS_DATA
    title: Converged Pending Orders (flat file)
    purpose: Pending orders across converged (FBA + MFN) fulfillment. Snapshot.

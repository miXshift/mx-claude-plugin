    report_options:
      - key: reportPeriod
        example: WEEK
        note: DAY | WEEK | MONTH.
    parse_hints: JSON with trafficByAsin[] (glanceViews) + aggregate.

  - report_type: GET_VENDOR_NET_PURE_PRODUCT_MARGIN_REPORT
    title: Vendor Net Pure Product Margin
    purpose: 1P net pure product margin (NPPM) by ASIN over a period.

# Amazon SP-API on-demand report catalog.
#
# This is a PLUGIN-side CONVENIENCE CACHE of report types the report-pull
# capability can request. It is NOT the source of truth and NOT a gate: the
# real definition of every report type (schema, reportOptions, window rules)
# is Amazon's public SP-API documentation, and the service decides at fetch
# time what a given tenant + merchant is actually allowed to pull. A report
# type missing from this file is still fully pullable: `report start` passes
# any type straight through, and `describe-report` on an unknown type returns
# a soft "look it up in the SP-API docs" result, not an error. The agent
# resolves unknown types from the public docs, drives the pull, and proposes a
# new entry here so the cache grows over time.
#
# This cache aims to be BROAD (many common report types, including ones that
# are commonly restricted) precisely so the agent rarely has to fall back to
# the docs, but breadth is a goal, not a guarantee, and there are no
# exclusions: we never pre-filter on a guess. The service decides reactively
# and returns a typed failure `kind` (restricted_report, reauth_required,
# spapi_not_configured, ...) that the skill surfaces. See
# harness/src/lib/amazon/reports.ts.
#
# Field reference (see lib/reports/catalog.ts for the typed shape):
#   report_type        Amazon enum, sent verbatim on the wire. The key field.
#   title              Short human label for menus / listings.
#   purpose            One line: what's in it + what it's good for.
#   applies_to         seller | vendor | both  (which merchant kind it's valid for)
#   document_format    tsv | json  (how the retrieved bytes are encoded)
#   window             required | optional | forbidden
#                        required  = Amazon rejects the request without a window
#                        optional  = window narrows results, not mandatory
#                        forbidden = snapshot report; Amazon rejects a window
#   window_notes       max span / lag / granularity rules for the window
#   warehouse_coverage have | partial | none  (does MixShift already hold this?)
#                        HINT ONLY — never a gate. `partial` = different grain
#                        or freshness; the report may still be worth pulling.
#   group              display grouping
#   report_options     report-type-specific knobs, passed to Amazon untouched
#   parse_hints        how to read the bytes once retrieved
#   notes              caveats (deprecations, regional limits, PII variants)

schema_version: 1
last_updated: 2026-06-04

reports:
  # =========================================================================
  # Orders (Seller)
  # The "general" variants are NON-PII and broadly available. A PII-enriched
  # variant of these exists but needs Amazon's RDT/PII role, which MixShift
  # does not hold; if a caller requests PII fields the service returns
  # restricted_report. Default (general) format is fine for most analysis.
  # =========================================================================
  - report_type: GET_FLAT_FILE_ALL_ORDERS_DATA_BY_ORDER_DATE_GENERAL
    title: All Orders by Order Date (flat file)
    purpose: Order-line rows keyed to the date the order was placed. Best for sales/order-volume analysis over a window.
    applies_to: seller
    document_format: tsv
    window: required
    window_notes: start/end required. Keep spans <= ~30 days for reliability; very old data may be unavailable.
    warehouse_coverage: partial
    group: Orders
    report_options: []
    parse_hints: Tab-separated with a header row; may carry a UTF-8 BOM on the first cell. Money/qty columns are strings — cast on read.
    notes: General (non-PII) variant. PII fields (buyer name/address) require an RDT role MixShift does not hold and will fail as restricted_report.

  - report_type: GET_FLAT_FILE_ALL_ORDERS_DATA_BY_LAST_UPDATE_GENERAL
    title: All Orders by Last Update (flat file)
    purpose: Same order-line rows but keyed to last-modified time. Use to catch status changes (cancellations, refunds) since a prior pull.
    applies_to: seller
    document_format: tsv
    window: required
    window_notes: start/end required; window applies to last-update timestamp, not order date.
    warehouse_coverage: partial
    group: Orders
    report_options: []
    parse_hints: TSV with header row; possible UTF-8 BOM. One row per order line; an order can appear under multiple updates across pulls.
    notes: General (non-PII) variant.

  - report_type: GET_XML_ALL_ORDERS_DATA_BY_ORDER_DATE_GENERAL
    title: All Orders by Order Date (XML)
    purpose: XML form of all-orders-by-order-date. Prefer the flat-file variant unless you specifically need XML structure.
    applies_to: seller
    document_format: tsv
    window: required
    window_notes: Same windowing as the flat-file variant.
    warehouse_coverage: partial
    group: Orders
    report_options: []
    parse_hints: Bytes are XML despite the tsv wire field name. Parse as XML, not tab-separated.
    notes: General (non-PII) variant.

  - report_type: GET_XML_ALL_ORDERS_DATA_BY_LAST_UPDATE_GENERAL
    title: All Orders by Last Update (XML)
    purpose: XML form keyed to last-modified time. Prefer the flat-file variant unless XML is required.
    applies_to: seller
    document_format: tsv
    window: required
    window_notes: Window applies to last-update timestamp.
    warehouse_coverage: partial
    group: Orders
    report_options: []
    parse_hints: Bytes are XML; parse accordingly.
    notes: General (non-PII) variant.

  - report_type: GET_FLAT_FILE_ARCHIVED_ORDERS_DATA_BY_ORDER_DATE
    title: Archived Orders by Order Date (flat file)
    purpose: Orders older than the standard retention window, by order date. Use for long-horizon backfills.
    applies_to: seller
    document_format: tsv
    window: required
    window_notes: For historical ranges beyond the live all-orders window.
    warehouse_coverage: partial
    group: Orders
    report_options: []
    parse_hints: TSV with header row; possible UTF-8 BOM.

  - report_type: GET_FLAT_FILE_ACTIONABLE_ORDER_DATA_SHIPPING
    title: Actionable Order Data (shipping)
    purpose: Unshipped / actionable MFN orders that need fulfillment action.
    applies_to: seller
    document_format: tsv
    window: optional
    warehouse_coverage: none
    group: Orders
    report_options: []
    parse_hints: TSV with header row. Snapshot-ish of currently actionable orders.

  - report_type: GET_FLAT_FILE_PENDING_ORDERS_DATA
    title: Pending Orders (flat file)
    purpose: Orders in pending state (payment not yet cleared). Snapshot of current pending queue.
    applies_to: seller
    document_format: tsv
    window: forbidden
    warehouse_coverage: none
    group: Orders
    report_options: []
    parse_hints: TSV with header row; current-state snapshot, no date window.

  - report_type: GET_PENDING_ORDERS_DATA

  # =========================================================================
  # Vendor (JSON) — for Vendor Central (1P) merchants only. Seller selectors
  # will fail merchant_not_found / restricted; pick a Vendor merchant.
  # =========================================================================
  - report_type: GET_VENDOR_SALES_REPORT
    title: Vendor Sales
    purpose: 1P sourcing/manufacturing sales — shipped + ordered revenue/units, by period. Core vendor revenue surface.
    applies_to: vendor
    document_format: json
    window: required
    window_notes: start/end required; align to reportPeriod. Vendor data lags ~48-72h, so set the end window about 3 days back to land on settled numbers (a too-recent end returns thin or empty rows).
    warehouse_coverage: have
    group: Vendor
    report_options:
      - key: reportPeriod
        example: WEEK
        note: DAY | WEEK | MONTH | QUARTER | YEAR.
      - key: distributorView
        example: MANUFACTURING
        note: MANUFACTURING | SOURCING.
      - key: sellingProgram
        example: RETAIL
        note: RETAIL | BUSINESS | FRESH.
    parse_hints: JSON with salesByAsin[] / salesAggregate. Pair the three reportOptions; mismatched combos return empty.
    notes: MixShift warehouse holds vendor sales (vendor_sales_manufacturing_asin). Pull on demand for windows/views not loaded.

  - report_type: GET_VENDOR_INVENTORY_REPORT
    title: Vendor Inventory
    purpose: 1P inventory health — sellable on hand, unsellable, open PO, sell-through, weeks of cover.
    applies_to: vendor
    document_format: json
    window: required
    window_notes: align to reportPeriod.
    warehouse_coverage: partial
    group: Vendor
    report_options:
      - key: reportPeriod
        example: WEEK
        note: DAY | WEEK | MONTH.
      - key: distributorView
        example: MANUFACTURING
        note: MANUFACTURING | SOURCING.
      - key: sellingProgram
        example: RETAIL
        note: RETAIL | BUSINESS | FRESH.
    parse_hints: JSON with inventoryByAsin[] + aggregate; sourcing vs manufacturing change the meaning of the quantities.

  - report_type: GET_VENDOR_TRAFFIC_REPORT
    title: Vendor Traffic
    purpose: 1P glance views (detail-page traffic) by ASIN over a period.
    applies_to: vendor
    document_format: json
    window: required
    window_notes: align to reportPeriod.
    warehouse_coverage: none

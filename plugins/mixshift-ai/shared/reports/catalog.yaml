  - report_type: GET_VENDOR_REAL_TIME_INVENTORY_REPORT
    title: Vendor Real-Time Inventory
    purpose: Near-real-time 1P inventory availability by ASIN. Faster cadence than the standard inventory report.
    applies_to: vendor

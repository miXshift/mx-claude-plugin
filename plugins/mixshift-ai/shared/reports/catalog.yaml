    window: forbidden
    warehouse_coverage: none
    group: Orders
    report_options: []
    parse_hints: TSV with header row; current-state snapshot.

  # =========================================================================
  # Sales & Traffic (Business Reports)
  # =========================================================================
  - report_type: GET_SALES_AND_TRAFFIC_REPORT
    title: Sales & Traffic Business Report
    purpose: Sessions, page views, units, sales, buy-box %, conversion — by date and/or ASIN. The core business-report surface.
    applies_to: seller
    document_format: json
    window: required
    window_notes: start/end required. dateGranularity controls the time bucket.
    warehouse_coverage: have
    group: Sales & Traffic
    report_options:
      - key: dateGranularity
        example: DAY
        note: DAY | WEEK | MONTH. Omit asinGranularity for date-only roll-up.
      - key: asinGranularity
        example: CHILD
        note: PARENT | CHILD | SKU. Sets the ASIN grain of the byAsin section.
    parse_hints: JSON object with salesAndTrafficByDate[] and salesAndTrafficByAsin[] arrays. Nested salesByAsin / trafficByAsin objects per row.
    notes: MixShift warehouse already holds the date-grain version (business_reports_dpst_date). Pull on demand mainly for ASIN-grain or windows the warehouse hasn't loaded.


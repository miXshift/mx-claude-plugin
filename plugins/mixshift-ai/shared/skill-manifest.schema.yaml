schema_version: 1
# Per-skill machine-readable descriptor for Skills Center ingestion.
# One skill.manifest.yaml per skill directory (skills/<skill-id>/skill.manifest.yaml).

required:
  - schema_version
  - skill_id          # matches directory name, e.g. mx-daily-health-check
  - display_name      # human-readable title
  - version           # semver string
  - description       # 1-3 sentences, no em dashes
  - run_kind          # per_account | portfolio
  - cadence           # daily | weekly | monthly | on_demand
  - risk_tier         # 1 | 2 | 3 — controls required (see skill-runtime-contract.md)
  - allowed_tools     # list of tool tokens the skill may invoke (see contract)
  - side_effect_policy  # none | artifact_write | context_write | recommendation_only | write_gated
  - review_required   # never | on_non_green | always
  - sql_ids           # list of canonical library IDs, or "UPSTREAM:<skill-id>" entries
  - required_context_fields  # dot-notation context.yaml paths this skill reads
  - artifacts         # list of {name, type} for outputs
  - verdict_range     # list of verdicts this skill can emit
  - pricing_tier      # free | pro | enterprise

optional:
  - trigger_phrases           # natural language triggers for skill discovery
  - optional_context_fields   # fields that enable conditional logic
  - upstream_skills           # skill IDs that must run first (produces UPSTREAM: sidecar)
  - escalation_conditions     # list of conditions that halt execution and surface to human
  - notes                     # short prose for cross-skill considerations

shapes:
  run_kind:
    enum: [per_account, portfolio]

  cadence:
    enum: [daily, weekly, monthly, on_demand]

  artifact:
    required: [name, type]
    type_enum: [report_html, context_yaml, narrative_md, json_artifact, block_html]

  verdict_range:
    note: |
      Possible values: GREEN, YELLOW, RED, OBSERVATIONAL.
      Skills that produce structured output (reports, data artifacts) without
      a go/no-go call use [OBSERVATIONAL] only.
      Skills with actionable exception logic use [GREEN, YELLOW, RED] (or subset).
      mx-brand-context uses [] (produces context, not a verdict).

  risk_tier:
    enum: [1, 2, 3]
    note: |
      1: Informational — read-only output, no durable artifacts, no production impact
      2: Artifact-writing — writes context.yaml, HTML reports, JSON artifacts, CSVs
      3: Production-facing — output drives bids, negatives, keyword promotions, pauses
      See skill-runtime-contract.md for full controls per tier.

  allowed_tools:
    type: list
    valid_tokens: [db_read, file_read, file_write, renderer, validator, web_search, prefetch, ads_write, insight_read]
    note: |
      db_read      — SQL queries via pre-fetch-data.py
      file_read    — read context.yaml, narrative.md, sidecars, artifacts
      file_write   — write to tmp/ or shared/clients/<brand>/
      renderer     — run a deterministic Python renderer script
      validator    — run validate-context.py or check-sql-drift.py
      web_search   — external web/social searches (Phase 0.5 only)
      prefetch     — invoke pre-fetch-data.py
      ads_write    — mutating Amazon Ads API calls via `mixshift ads call ... --commit` (dry-run default; user-confirmed)
      insight_read — reads finished insight envelopes from the MixShift Intelligence service via `mixshift intelligence run|poll|get`; no warehouse SQL, no writes

  side_effect_policy:
    enum: [none, artifact_write, context_write, recommendation_only, write_gated]
    note: |
      none               — session-only output, nothing written
      artifact_write     — writes to tmp/ only (transient, reviewable)
      context_write      — writes to shared/clients/<brand>/ (durable)
      recommendation_only — writes report to tmp/; execution requires human approval
      write_gated        — mutates external state (Amazon Ads API) via the bundled CLI; dry-run/preview by default, every commit requires explicit user confirmation (pairs with review_required: always)

  review_required:
    enum: [never, on_non_green, always]
    note: |
      never        — Tier 1; informational output, no action gated on it
      on_non_green — review required on YELLOW or RED verdict
      always       — any durable context write or production-facing recommendation

  pricing_tier:
    enum: [free, pro, enterprise]
    note: |
      free: no account connection required
      pro: single-account skills requiring DB access
      enterprise: multi-account or cross-skill orchestration skills

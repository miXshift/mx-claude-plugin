  - id: CS-28
    file: CS-28.sql
    dispatch: named   # SQL served server-side from the mx-legacy-auth query pack; .sql kept as fallback + byte-diff reference until the Phase 5 sweep
    purpose: Attribution settlement curve by campaign type x day-of-week (trailing 90d) for cold-start v2.3 enrichment.
    consumers: [mx-account-cold-start]
    tier: 1
    notes: |
      Expands the CS-06/CS-07 single improvement_pts number into a daily curve
      shape. Output is reshaped by the cold-start renderer into
      capture_rate_calibration.daily_settlement_curve.by_campaign_type[CT] and
      .dow_offset_pts[DOW]. DAYOFWEEK convention: 1=Sun..7=Sat.

  - id: CS-29
    file: CS-29.sql

    purpose: Inventory-health historical snapshots for stockout-window detection (trailing 365d, FBA-only).
    consumers: [mx-account-cold-start]
    tier: 1
    notes: |
      Pre-filtered to "in trouble" rows so the enrichment step only has to group
      consecutive dates per ASIN to form contiguous OOS windows. Pattern mirrors
      DHC-12 (live stockout follow-up) with an added historical date range.
      VC limitation: FBA-only; MFN inventory not tracked.


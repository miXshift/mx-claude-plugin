      account-level CI thresholds.

  # --- Brand-brain pulls (background discovery pipeline) ----------------
  # dispatch: named entries carry no .sql file in this repo. The query
  # body lives server-side in the private mx-legacy-auth query pack and
  # executes via POST /api/named-query, keyed by this catalog id. The
  # retained sproc: name documents the superseded stored-procedure pilot
  # and keeps the MIXSHIFT_SPROC_SQL_DIR local-dev fallback resolving.
  # See internal/SP-MIGRATION.md (2026-06-12 revision) +
  # internal/BACKGROUND-DISCOVERY.md.

  - id: BRAIN-CATALOG-SC
    dispatch: named
    sproc: sp_brain_catalog_fetch_sc
    purpose: SC catalog shape pull (in-catalog items with brand/group/label taxonomy) for key-brand background discovery. Aggregated client-side; the brain stores distincts and counts only.
    consumers: [brand-brain-fetch]
    tier: 1
    notes: |
      Scoped by the brand's SC seller ids (request sellerIds).

  - id: BRAIN-CATALOG-VC
    dispatch: named
    sproc: sp_brain_catalog_fetch_vc
    purpose: VC catalog shape pull (vendor items with custom-brand/group/label taxonomy) for key-brand background discovery. Aggregated client-side.
    consumers: [brand-brain-fetch]
    tier: 1
    notes: |
      Scoped by the brand's VC seller ids (request sellerIds).

  - id: BRAIN-CAMPAIGN
    dispatch: named
    sproc: sp_brain_campaign_fetch
    purpose: Campaign-structure pull (enabled and paused campaigns with objective/group/brand taxonomy and structure flags) for key-brand background discovery. Aggregated client-side.
    consumers: [brand-brain-fetch]
    tier: 1
    notes: |
      Scoped by all of the brand's seller ids (SC, VC, and DSP seats all
      carry campaign rows).

  - id: BRAIN-SELLER
    dispatch: named
    sproc: sp_brain_seller_fetch
    purpose: Seller-level brand-brain pull (identity, targets, budget, marketplace metadata, data freshness) for key-brand background discovery.
    consumers: [brand-brain-fetch]
    tier: 1
    notes: |
      First-slice brain source. Scoped by the brand's seller ids (request
      sellerIds). Returns one row per seller id.

  - id: BRAIN-HERO-SC
    dispatch: named
    purpose: SC hero-ASIN pull (top-20 by trailing-365d ordered revenue from business_reports_dpst_sku, with current sellable qty + days-of-supply from the latest mws_inventory_health snapshot) for key-brand background discovery. Aggregated client-side into catalog.top_asins.sc.
    consumers: [brand-brain-fetch]
    tier: 1
    notes: |
      Scoped by the brand's SC seller ids (request sellerIds). Born
      dispatch:named (no public .sql ancestor).

  - id: BRAIN-HERO-VC
    dispatch: named
    purpose: VC hero-ASIN pull (top-20 by trailing-365d ordered revenue from vendor_sales_manufacturing_asin) for key-brand background discovery. Aggregated client-side into catalog.top_asins.vc.
    consumers: [brand-brain-fetch]
    tier: 1
    notes: |
      Scoped by the brand's VC seller ids (request sellerIds). Separate
      from SC: a hybrid 1P+3P brand ranks the same ASINs differently per
      channel.

  - id: BRAIN-RECENT-ACTIVITY
    dispatch: named
    purpose: Recent-activity baseline (trailing-30d ad spend + ad sales from campaignmetric, rolled up across all the brand's sellers) for key-brand background discovery. Cached into recent_activity so DHC no longer re-pulls.
    consumers: [brand-brain-fetch]
    tier: 1
    notes: |
      Scoped by all of the brand's seller ids (request sellerIds). Brand
      roll-up, NOT DHC-01-on-primary (that returned nulls for VC-primary
      brands whose ad activity sits on another seat).
